# Builds, signs and uploads the iOS app to TestFlight from GitHub's macOS
# runner — no Mac needed. Manual trigger only (Actions → "iOS TestFlight
# upload" → Run workflow), never on push.
#
# Signing uses Xcode cloud signing with an App Store Connect API key: the
# certificates and the App Store provisioning profile are created and kept
# by Apple, so no .p12 or .mobileprovision is ever stored in this repo or in
# GitHub. The upload lands in App Store Connect → TestFlight only; nothing
# here submits the app for App Store review or releases it to the public.
#
# Required (set once in repo Settings → Secrets and variables → Actions; see
# docs/MOBILE.md → "TestFlight from GitHub Actions"):
#   Variables: TASTEKIN_API_BASE_URL  (https origin of the production API)
#              APPLE_TEAM_ID          (10-character Team ID)
#   Secrets:   APP_STORE_CONNECT_API_KEY_ID
#              APP_STORE_CONNECT_API_ISSUER_ID
#              APP_STORE_CONNECT_API_KEY_P8   (full text of the .p8 key file)
# The App Store Connect app record for bundle ID app.tastekin must exist.
name: iOS TestFlight upload

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (CFBundleVersion). Empty = this run number.'
        required: false
        default: ''

concurrency:
  group: ios-testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload:
    name: Archive, cloud-sign and upload to TestFlight
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      VITE_API_BASE_URL: ${{ vars.TASTEKIN_API_BASE_URL }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      BUILD_NUMBER: ${{ inputs.build_number != '' && inputs.build_number || github.run_number }}
    steps:
      - name: Preflight — required variables and secrets are present
        env:
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          missing=()
          [ -n "$VITE_API_BASE_URL" ] || missing+=("repository variable TASTEKIN_API_BASE_URL")
          [ -n "$APPLE_TEAM_ID" ]     || missing+=("repository variable APPLE_TEAM_ID")
          [ -n "$ASC_KEY_ID" ]        || missing+=("secret APP_STORE_CONNECT_API_KEY_ID")
          [ -n "$ASC_ISSUER_ID" ]     || missing+=("secret APP_STORE_CONNECT_API_ISSUER_ID")
          [ -n "$ASC_KEY_P8" ]        || missing+=("secret APP_STORE_CONNECT_API_KEY_P8")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Cannot upload to TestFlight — missing: ${missing[*]}. See docs/MOBILE.md → TestFlight from GitHub Actions."
            exit 1
          fi
          case "$VITE_API_BASE_URL" in
            https://*) ;;
            *) echo "::error::TASTEKIN_API_BASE_URL must be an https:// origin (got a value that is not)."; exit 1 ;;
          esac
          case "$ASC_KEY_P8" in
            *"BEGIN PRIVATE KEY"*) ;;
            *) echo "::error::APP_STORE_CONNECT_API_KEY_P8 must contain the whole .p8 file text, including the BEGIN/END PRIVATE KEY lines."; exit 1 ;;
          esac
          echo "Build number for this upload: $BUILD_NUMBER"

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck:libs
      - name: Build the web bundle against the production API
        run: pnpm --filter @workspace/tastekin run build
      - name: Sync web assets into the iOS project
        working-directory: artifacts/tastekin
        run: npx cap sync ios

      - name: Install the App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          umask 077
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "$ASC_KEY_P8" > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Write export options (App Store Connect upload, automatic signing)
        working-directory: artifacts/tastekin/ios/App
        run: |
          mkdir -p build
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF

      - name: Show toolchain
        run: xcodebuild -version
      - name: Resolve Swift packages
        working-directory: artifacts/tastekin/ios/App
        run: xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App

      - name: Archive (Release, device, cloud-managed signing)
        working-directory: artifacts/tastekin/ios/App
        run: |
          xcodebuild archive -quiet \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Export and upload to App Store Connect (TestFlight)
        working-directory: artifacts/tastekin/ios/App
        run: |
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Summary
        if: success()
        working-directory: artifacts/tastekin/ios/App
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleShortVersionString' build/App.xcarchive/Info.plist 2>/dev/null || echo '?')
          build=$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleVersion' build/App.xcarchive/Info.plist 2>/dev/null || echo "$BUILD_NUMBER")
          {
            echo "## Uploaded to App Store Connect"
            echo ""
            echo "- Bundle ID: app.tastekin"
            echo "- Version: ${version} (build ${build})"
            echo "- Where to find it: App Store Connect → Apps → TASTEKIN → TestFlight. Processing usually takes 10–30 minutes; Apple emails when the build is ready for internal testers."
            echo "- Nothing was submitted for App Store review."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the API key from the runner
        if: always()
        run: |
          if [ -n "${ASC_KEY_PATH:-}" ] && [ -f "$ASC_KEY_PATH" ]; then rm -P "$ASC_KEY_PATH" 2>/dev/null || rm -f "$ASC_KEY_PATH"; fi

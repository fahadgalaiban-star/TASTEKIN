openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: discovery
    description: Consumer discovery and taste surfaces
  - name: relationships
    description: Consumer trust and save relationships
  - name: creator-workspace
    description: Shared creator publishing workspace
  - name: creator-profile
    description: Creator identity and public profile presentation
  - name: taste-match
    description: Private taste preferences and transparent creator matching
  - name: storage
    description: Protected creator media storage
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /feed:
    get:
      operationId: getFeed
      tags: [discovery]
      summary: Get the consumer home feed
      responses:
        "200":
          description: Mixed feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Edit"
  /creators:
    get:
      operationId: listCreators
      tags: [discovery]
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: city
          schema: { type: string }
      responses:
        "200":
          description: Creator results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Creator"
  /creators/{username}:
    get:
      operationId: getCreator
      tags: [discovery]
      parameters:
        - in: path
          name: username
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Creator profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorProfile"
        "404":
          description: Creator not found
  /explore:
    get:
      operationId: explore
      tags: [discovery]
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: city
          schema: { type: string }
        - in: query
          name: sort
          schema: { type: string, enum: [best, new] }
      responses:
        "200":
          description: Grouped discovery results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExploreResults"
  /taste-catalog:
    get:
      operationId: getTasteCatalog
      tags: [taste-match]
      summary: Get the approved taste categories and tags
      responses:
        "200":
          description: Taste catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TasteCatalog"
  /taste-preferences:
    get:
      operationId: getTastePreferences
      tags: [taste-match]
      summary: Get the authenticated user's private taste preferences
      responses:
        "200":
          description: Private taste preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TastePreferences"
        "401":
          description: Authentication required
    put:
      operationId: saveTastePreferences
      tags: [taste-match]
      summary: Save the authenticated user's private taste preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TastePreferencesInput"
      responses:
        "200":
          description: Saved private taste preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TastePreferences"
        "400":
          description: Invalid taste preferences
        "401":
          description: Authentication required
  /taste-match/{username}:
    get:
      operationId: getTasteMatch
      tags: [taste-match]
      summary: Get a public-safe transparent taste match for a creator
      parameters:
        - in: path
          name: username
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Taste match state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TasteMatchResponse"
        "404":
          description: Creator not found
  /edits/{id}:
    get:
      operationId: getEdit
      tags: [discovery]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Edit detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Edit"
  /relationships:
    post:
      operationId: updateRelationship
      tags: [relationships]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelationshipInput"
      responses:
        "200":
          description: Updated relationship
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Relationship"
  /creator-workspace:
    get:
      operationId: getCreatorWorkspace
      tags: [creator-workspace]
      summary: Get Fheed's shared creator workspace
      responses:
        "200":
          description: Shared workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorWorkspace"
    put:
      operationId: saveCreatorWorkspace
      tags: [creator-workspace]
      summary: Save Fheed's shared creator workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatorWorkspaceInput"
      responses:
        "200":
          description: Saved shared workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorWorkspace"
        "400":
          description: Invalid creator workspace
        "403":
          description: Creator owner preview required
  /creator-profile:
    get:
      operationId: getCreatorProfile
      tags: [creator-profile]
      summary: Get Fheed's public-safe creator profile
      responses:
        "200":
          description: Creator profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorProfileSettings"
    put:
      operationId: saveCreatorProfile
      tags: [creator-profile]
      summary: Save the authenticated Fheed creator profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatorProfileInput"
      responses:
        "200":
          description: Saved creator profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorProfileSettings"
        "400":
          description: Invalid creator profile
        "403":
          description: Creator owner access required
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a private creator-media upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatorUploadRequest"
      responses:
        "200":
          description: Private upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorUploadResponse"
        "400":
          description: Invalid image metadata
        "403":
          description: Creator owner preview required
  /storage/uploads/cleanup:
    post:
      operationId: cleanupCreatorMedia
      tags: [storage]
      summary: Remove newly uploaded private creator-media renditions after a failed save
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatorMediaCleanupRequest"
      responses:
        "204":
          description: Media cleanup completed
        "400":
          description: Invalid private media paths
        "403":
          description: Creator owner preview required
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Creator:
      type: object
      required: [id, username, displayName, categories, city, matchScore, verified]
      properties:
        id: { type: string }
        username: { type: string }
        displayName: { type: string }
        avatar: { type: string }
        categories:
          type: array
          items: { type: string }
        city: { type: string }
        matchScore: { type: ["number", "null"], format: int32 }
        verified: { type: boolean }
        bio: { type: string }
        matchState: { type: string, enum: [ready, incomplete, signed_out] }
        sharedTastes:
          type: array
          items: { $ref: "#/components/schemas/SharedTaste" }
        matchReasons:
          type: array
          items: { type: string }
    CreatorProfile:
      allOf:
        - $ref: "#/components/schemas/Creator"
        - type: object
          required: [editCount, collectionCount, reasons, edits, collections]
          properties:
            editCount: { type: number, format: int32 }
            collectionCount: { type: number, format: int32 }
            reasons:
              type: array
              items: { type: string }
            edits:
              type: array
              items: { $ref: "#/components/schemas/Edit" }
            collections:
              type: array
              items: { $ref: "#/components/schemas/Collection" }
    Edit:
      type: object
      required: [id, creatorUsername, creatorName, title, caption, contentType, access, image, tags, saved]
      properties:
        id: { type: string }
        creatorUsername: { type: string }
        creatorName: { type: string }
        creatorAvatar: { type: string }
        creatorVerified: { type: boolean }
        title: { type: string }
        caption: { type: string }
        contentType: { type: string }
        access: { type: string, enum: [public, subscribers] }
        image: { type: string }
        altText: { type: string }
        location: { type: string }
        tags:
          type: array
          items: { type: string }
        saved: { type: boolean }
        sponsored: { type: boolean }
        publishedAt: { type: string }
    Collection:
      type: object
      required: [id, creatorUsername, title, description, image, itemCount, access]
      properties:
        id: { type: string }
        creatorUsername: { type: string }
        title: { type: string }
        description: { type: string }
        image: { type: string }
        itemCount: { type: number, format: int32 }
        access: { type: string, enum: [public, mixed, subscribers] }
        updatedAt: { type: string }
    ExploreResults:
      type: object
      required: [authenticated, sort, creators, edits, collections, places, products]
      properties:
        authenticated: { type: boolean }
        sort: { type: string, enum: [best, new] }
        creators:
          type: array
          items: { $ref: "#/components/schemas/Creator" }
        edits:
          type: array
          items: { $ref: "#/components/schemas/Edit" }
        collections:
          type: array
          items: { $ref: "#/components/schemas/Collection" }
        places:
          type: array
          items: { type: string }
        products:
          type: array
          items: { type: string }
    TasteCategory:
      type: object
      required: [id, label, labelAr]
      properties:
        id: { type: string }
        label: { type: string }
        labelAr: { type: string }
    TasteTag:
      type: object
      required: [id, categoryId, label, labelAr]
      properties:
        id: { type: string }
        categoryId: { type: string }
        label: { type: string }
        labelAr: { type: string }
    TasteCatalog:
      type: object
      required: [categories, tags, minCategories, minTags]
      properties:
        categories:
          type: array
          items: { $ref: "#/components/schemas/TasteCategory" }
        tags:
          type: array
          items: { $ref: "#/components/schemas/TasteTag" }
        minCategories: { type: number, minimum: 1 }
        minTags: { type: number, minimum: 1 }
    TastePreferencesInput:
      type: object
      required: [categories, tags]
      properties:
        categories:
          type: array
          maxItems: 10
          items: { type: string }
        tags:
          type: array
          maxItems: 30
          items: { type: string }
    TastePreferences:
      allOf:
        - $ref: "#/components/schemas/TastePreferencesInput"
        - type: object
          required: [complete, updatedAt]
          properties:
            complete: { type: boolean }
            updatedAt: { type: string, format: date-time }
    SharedTaste:
      type: object
      required: [id, label, labelAr, type]
      properties:
        id: { type: string }
        label: { type: string }
        labelAr: { type: string }
        type: { type: string, enum: [category, tag] }
    TasteMatch:
      type: object
      required: [state, score, sharedTastes, explanation, explanationAr]
      properties:
        state: { type: string, enum: [ready, incomplete, signed_out] }
        score: { type: ["number", "null"], minimum: 0, maximum: 100 }
        sharedTastes:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/SharedTaste" }
        explanation: { type: string }
        explanationAr: { type: string }
    TasteMatchResponse:
      type: object
      required: [authenticated, creator, preferences, match]
      properties:
        authenticated: { type: boolean }
        creator: { $ref: "#/components/schemas/Creator" }
        preferences:
          type: ["object", "null"]
          properties:
            categories:
              type: array
              items: { type: string }
            tags:
              type: array
              items: { type: string }
            complete: { type: boolean }
        match: { $ref: "#/components/schemas/TasteMatch" }
    RelationshipInput:
      type: object
      required: [type, targetId, active]
      properties:
        type: { type: string, enum: [follow, save, block, mute] }
        targetId: { type: string }
        active: { type: boolean }
    Relationship:
      allOf:
        - $ref: "#/components/schemas/RelationshipInput"
        - type: object
          required: [updatedAt]
          properties:
            updatedAt: { type: string }
    CreatorImageMetadata:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        size: { type: number, format: int32, minimum: 1, maximum: 15728640 }
        contentType: { type: string, minLength: 1, maxLength: 120 }
    CreatorMediaCleanupRequest:
      type: object
      required: [objectPaths]
      properties:
        objectPaths:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: string
            pattern: '^/objects/uploads/[0-9a-fA-F-]{36}$'
    CreatorProfileSettings:
      type: object
      required: [displayName, username, bio, city, country, interests, avatar, age, dateOfBirth, showAge, verified, avatarObjectPath, revision]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 80 }
        username: { type: string, minLength: 3, maxLength: 30, pattern: '^[a-z0-9_]+$' }
        bio: { type: string, maxLength: 500 }
        city: { type: string, maxLength: 80 }
        country: { type: string, maxLength: 80 }
        interests:
          type: array
          maxItems: 12
          items: { type: string, minLength: 1, maxLength: 60 }
        avatar: { type: string, minLength: 1, maxLength: 1024 }
        avatarObjectPath: { type: ["string", "null"], maxLength: 1024 }
        age: { type: ["number", "null"], format: int32, minimum: 13, maximum: 120 }
        dateOfBirth: { type: ["string", "null"], pattern: '^\d{4}-\d{2}-\d{2}$' }
        showAge: { type: boolean }
        verified: { type: boolean }
        revision: { type: number, format: int32, minimum: 1 }
    CreatorProfileInput:
      type: object
      required: [displayName, username, bio, city, country, interests, dateOfBirth, showAge, avatarObjectPath]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 80 }
        username: { type: string, minLength: 3, maxLength: 30, pattern: '^[a-z0-9_]+$' }
        bio: { type: string, maxLength: 500 }
        city: { type: string, maxLength: 80 }
        country: { type: string, maxLength: 80 }
        interests:
          type: array
          maxItems: 12
          items: { type: string, minLength: 1, maxLength: 60 }
        dateOfBirth: { type: ["string", "null"], pattern: '^\d{4}-\d{2}-\d{2}$' }
        showAge: { type: boolean }
        avatarObjectPath:
          type: ["string", "null"]
          maxLength: 1024
          pattern: '^/objects/uploads/[0-9a-fA-F-]{36}$'
    CreatorCrop:
      allOf:
        - type: object
          required: [aspect, zoom, x, y, rotation, sourceWidth, sourceHeight, outputWidth, outputHeight]
          properties:
            aspect: { type: string, enum: [square, portrait, story] }
            zoom: { type: number, minimum: 0.001, maximum: 3840 }
            x: { type: number, minimum: -50, maximum: 50 }
            y: { type: number, minimum: -50, maximum: 50 }
            rotation: { type: number, minimum: -360, maximum: 360 }
            sourceWidth: { type: number, format: int32, minimum: 1, maximum: 10000 }
            sourceHeight: { type: number, format: int32, minimum: 1, maximum: 10000 }
            outputWidth: { type: number, format: int32 }
            outputHeight: { type: number, format: int32 }
        - oneOf:
            - type: object
              properties:
                aspect: { type: string, enum: [portrait] }
                outputWidth: { type: number, enum: [1080] }
                outputHeight: { type: number, enum: [1350] }
            - type: object
              properties:
                aspect: { type: string, enum: [square] }
                outputWidth: { type: number, enum: [1080] }
                outputHeight: { type: number, enum: [1080] }
            - type: object
              properties:
                aspect: { type: string, enum: [story] }
                outputWidth: { type: number, enum: [1080] }
                outputHeight: { type: number, enum: [1920] }
    CreatorOutfitItem:
      type: object
      required: [type, brand, name, link]
      properties:
        type: { type: string, maxLength: 100 }
        brand: { type: string, maxLength: 160 }
        name: { type: string, maxLength: 240 }
        link: { type: string, maxLength: 1024 }
    CreatorEdit:
      type: object
      required: [id, category, title, titleAr, caption, captionAr, image, location, locationAr, altText, access, status, collectionIds]
      properties:
        id: { type: string, minLength: 1, maxLength: 120 }
        category: { type: string, enum: [Fashion, Travel, Places, Restaurants, DailyRoutine, PersonalCare, HealthFitness, Decor, Books, Vlogs] }
        title: { type: string, maxLength: 160 }
        titleAr: { type: string, maxLength: 160 }
        caption: { type: string, maxLength: 2000 }
        captionAr: { type: string, maxLength: 2000 }
        image: { type: string, minLength: 1, maxLength: 1024 }
        sourceImage: { type: string, maxLength: 1024 }
        previewImage: { type: string, maxLength: 1024 }
        imageMetadata: { $ref: "#/components/schemas/CreatorImageMetadata" }
        crop: { $ref: "#/components/schemas/CreatorCrop" }
        outfitItems:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/CreatorOutfitItem" }
        showOutfitDetails: { type: boolean }
        location: { type: string, maxLength: 240 }
        locationAr: { type: string, maxLength: 240 }
        altText: { type: string, maxLength: 500 }
        access: { type: string, enum: [public, locked] }
        status: { type: string, enum: [draft, published, archived] }
        collectionIds:
          type: array
          maxItems: 30
          items: { type: string, minLength: 1, maxLength: 120 }
    CreatorCollection:
      type: object
      required: [id, title, titleAr, description, descriptionAr, access, coverEditId, editIds]
      properties:
        id: { type: string, minLength: 1, maxLength: 120 }
        title: { type: string, maxLength: 160 }
        titleAr: { type: string, maxLength: 160 }
        description: { type: string, maxLength: 2000 }
        descriptionAr: { type: string, maxLength: 2000 }
        access: { type: string, enum: [public, locked] }
        coverEditId: { type: string, minLength: 1, maxLength: 120 }
        editIds:
          type: array
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 120 }
    CreatorWorkspaceInput:
      type: object
      required: [edits, collections]
      properties:
        edits:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/CreatorEdit" }
        collections:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/CreatorCollection" }
        expectedRevision:
          type: number
          format: int32
          minimum: 1
    CreatorWorkspace:
      allOf:
        - $ref: "#/components/schemas/CreatorWorkspaceInput"
        - type: object
          required: [creatorId, revision, updatedAt]
          properties:
            creatorId: { type: string }
            revision: { type: number, format: int32 }
            updatedAt: { type: string, format: date-time }
    CreatorUploadRequest:
      allOf:
        - $ref: "#/components/schemas/CreatorImageMetadata"
    CreatorUploadResponse:
      type: object
      required: [uploadURL, objectPath, metadata]
      properties:
        uploadURL: { type: string }
        objectPath: { type: string, pattern: "^/objects/" }
        metadata: { $ref: "#/components/schemas/CreatorImageMetadata" }

